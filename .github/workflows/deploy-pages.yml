name: Build portfolio and CRO demo for GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .nojekyll
      - '.github/workflows/deploy-pages.yml'
      - 'projects/growth-intelligence-pipeline/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          path: portfolio
      - name: Checkout CRO application
        uses: actions/checkout@v4
        with:
          repository: ninjaDX27/cro-landing-pages
          ref: main
          path: cro-app
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cro-app/package-lock.json
      - name: Test and build CRO application
        working-directory: cro-app
        run: |
          npm ci
          npm test
          npm run build -- --base=./
      - name: Test and build growth intelligence application
        working-directory: portfolio/projects/growth-intelligence-pipeline
        run: |
          npm test
          npm run build
      - name: Assemble portfolio and browser demo
        run: |
          mkdir -p site/cro site/growth
          cp portfolio/index.html site/index.html
          touch site/.nojekyll
          cp -R cro-app/dist/. site/cro/
          cp -R portfolio/projects/growth-intelligence-pipeline/dist/growth/. site/growth/
          test -f site/index.html
          test -f site/cro/index.html
          test -f site/growth/index.html
          echo "CRO demo copied into /cro/; growth intelligence into /growth/"

      - name: Upload downloadable browser preview
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-preview
          path: site
          retention-days: 14

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish portfolio and CRO demo
        id: deployment
        uses: actions/deploy-pages@v4
