name: Validate portfolio projects
on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'index.html'
      - '.github/workflows/portfolio-checks.yml'
  pull_request:
    paths:
      - 'projects/**'
      - 'index.html'
      - '.github/workflows/portfolio-checks.yml'
permissions:
  contents: read
jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: projects/customer-repurchase-propensity/requirements.txt
      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/sales-performance-dashboard/requirements.txt -r projects/customer-repurchase-propensity/requirements.txt
      - name: Set up Node for the growth intelligence pipeline
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build growth intelligence demo
        run: |
          cd projects/growth-intelligence-pipeline
          npm test
          npm run build
          test -s dist/growth/index.html
          test -s dist/growth/data/campaign_daily.csv
          test -s dist/growth/data/lead_lifecycle.csv
          test -s dist/growth/data/campaign_cohort_metrics.csv
          test -s dist/growth/data/monthly_cohorts.csv
          node --input-type=module -e "import{readFileSync}from'node:fs';const h=readFileSync('dist/growth/index.html','utf8');if(!h.includes('pipeline-data')||h.includes('<!--SYNTHETIC_DATA-->'))process.exit(1)"
      - name: Validate MongoDB adapter input and transition rules
        run: |
          cd projects/growth-intelligence-pipeline/mongodb
          npm test
          node --check src/server.mjs
          node --check src/db.mjs
          node --check scripts/smoke-test.mjs
      - name: Validate website JavaScript and source links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S | re.I)
          assert len(scripts) == 1, "Expected one self-contained inline script"
          Path("/tmp/site-script.js").write_text(scripts[0], encoding="utf-8")
          for project in ("sales-performance-dashboard", "customer-repurchase-propensity"):
              assert Path("projects", project, "README.md").exists()
              assert f"/{project}" in html
          assert "<meta name=\"viewport\"" in html
          print("Portfolio HTML structure and source links validated")
          PY
          node --check /tmp/site-script.js
      - name: Validate Python syntax
        run: |
          python -m py_compile projects/sales-performance-dashboard/etl.py projects/sales-performance-dashboard/dashboard.py projects/customer-repurchase-propensity/generate_demo.py projects/customer-repurchase-propensity/train.py
      - name: Synthetic end-to-end model validation
        run: |
          python projects/customer-repurchase-propensity/generate_demo.py --out data/demo/invoices.csv
          python projects/customer-repurchase-propensity/train.py --input data/demo/invoices.csv --out dist/demo
          python -c "import json; m=json.load(open('dist/demo/metrics.json')); assert len(m['test_comparison'])==3; assert m['sample_sizes']['test']>40; print('Model validation passed')"
